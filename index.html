<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12303a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Weight Journal"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Weight Journal</title><style>
:root{--bg:#eef1f4;--card:#fff;--ink:#0f1b2d;--mut:#6b7789;--ln:#e2e7ec;--w:#2f6f6a;--c:#c27c2c;--ok:#3c8a6b;--hero:#12303a;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0b1117;--card:#141d26;--ink:#e9eef3;--mut:#8696a7;--ln:#233040;--w:#6fc2b8;--c:#e3a85c;--ok:#69c49a;--hero:#1b3b46;--on:#0b1117}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px 28px}
h1{font-size:30px;margin:2px 0 4px;font-weight:700;letter-spacing:-.6px}
.sub{color:var(--mut);margin:0 0 18px;font-size:15px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,27,45,.05)}
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:22px;margin-bottom:14px}.hero .k{color:rgba(255,255,255,.72)}
.big{font-size:64px;font-weight:300;letter-spacing:-2px;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:4px}
.big small{font-size:20px;font-weight:400;margin-left:6px;opacity:.7;letter-spacing:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.grid .card{margin:0}
.g3{grid-template-columns:repeat(3,1fr)}.g3 .v{font-size:19px}.g3 .card{padding:13px}
.k{color:var(--mut);font-size:13px}.v{font-size:23px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.in{display:flex;gap:10px}label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}
input{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);-webkit-appearance:none;appearance:none;min-height:48px}
input:focus,textarea:focus{outline:2px solid var(--w);outline-offset:1px}
button{font:inherit;cursor:pointer}button:active{opacity:.7}
.btn{width:100%;padding:15px;border:0;border-radius:14px;background:var(--w);color:var(--on);font-weight:600;margin-top:12px}
.ghost{background:none;border:1px solid var(--ln);color:var(--ink)}
.lnk{display:block;width:100%;background:none;border:0;color:var(--mut);padding:12px;font-size:14px}
.dt{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.dt button{flex:none;width:46px;height:46px;border-radius:12px;border:0;background:var(--bg);color:var(--ink);font-size:22px}
.dt input{font-size:16px;text-align:center}
.bar{height:8px;border-radius:4px;background:var(--ln);overflow:hidden;margin:10px 0 8px}.bar i{display:block;height:100%;background:var(--w);border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}td,th{padding:11px 4px;border-bottom:1px solid var(--ln);text-align:left}tr:last-child td{border:0}th{color:var(--mut);font-weight:500;font-size:13px}td:not(:first-child),th:not(:first-child){text-align:right}
tr[data-d]{cursor:pointer}.ok{color:var(--ok)}.over{color:var(--c)}
nav{display:flex;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--ln)}
nav button{flex:1;padding:11px 0;border:0;border-radius:12px;background:none;color:var(--mut);font-size:13px;font-weight:500}
nav button.on{background:var(--bg);color:var(--ink);font-weight:600}
svg{width:100%;height:auto;display:block}.b1{fill:var(--ok)}.b2{fill:var(--c)}
textarea{width:100%;height:90px;font:12px ui-monospace,monospace;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);padding:10px}
.err{color:var(--ok);font-size:14px;min-height:20px;margin-top:8px}.err.bad{color:var(--c)}
#lock{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.lk{width:100%;max-width:360px}.logo{font-size:46px;font-weight:300;letter-spacing:-1.5px;line-height:1.05;margin-bottom:10px}
#sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sh{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:24px 22px calc(22px + env(safe-area-inset-bottom))}
.sh h3{margin:0 0 10px;font-size:21px}.sh ol{padding-left:20px;margin:0}.sh li{margin-bottom:9px}
</style></head><body><main id="m"></main><nav><button data-t="today" onclick="go('today')">Today</button><button data-t="weight" onclick="go('weight')">Weight</button><button data-t="cal" onclick="go('cal')">Calories</button><button data-t="set" onclick="go('set')">Settings</button></nav><div id="lock" hidden></div><div id="sheet" hidden></div><script>
const $=s=>document.querySelector(s),LS='wj2';
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let s='';new Uint8Array(u).forEach(c=>s+=String.fromCharCode(c));return btoa(s)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let KEY=null,SALT=null,S=null;
const derive=async(p,salt)=>crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
const seal=async()=>{const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,enc.encode(JSON.stringify(S)));localStorage.setItem(LS,JSON.stringify({s:b64(SALT),i:b64(iv),c:b64(ct)}))};
const save=()=>{if(KEY)seal().catch(()=>{})};
async function unlock(p){const o=JSON.parse(localStorage.getItem(LS));const salt=ub(o.s),k=await derive(p,salt);try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.i)},k,ub(o.c));S=JSON.parse(dec.decode(pt));SALT=salt;KEY=k;return true}catch(e){return false}}
async function create(p){SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await derive(p,SALT);S={start:'2026-10-19',goal:null,target:1700,e:{'2026-10-19':{w:95.15,k:1204}}};await seal()}
function showLock(){const lk=$('#lock'),nw=!localStorage.getItem(LS);lk.hidden=false;
if(!window.crypto||!crypto.subtle){lk.innerHTML='<div class="lk"><p>This app needs a secure (https) connection to protect your data. Open it from its https address.</p></div>';return}
lk.innerHTML=`<div class="lk"><div class="logo">Weight<br>Journal</div><p class="sub">${nw?'Create a passcode. It encrypts your data on this device.':'Welcome back.'}</p><input id="p1" type="password" autocomplete="${nw?'new-password':'current-password'}" placeholder="${nw?'Passcode (6+ characters)':'Passcode'}">${nw?'<div style="height:10px"></div><input id="p2" type="password" autocomplete="new-password" placeholder="Repeat passcode">':''}<button class="btn" id="go" onclick="doLock()">${nw?'Create and open':'Unlock'}</button><div id="le" class="err bad"></div>${nw?'':'<button class="lnk" onclick="wipe()">Forgot passcode? Erase and start over</button>'}<button class="lnk" onclick="inst()">Install on your phone</button></div>`;
lk.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')doLock()});$('#p1').focus()}
async function doLock(){const nw=!localStorage.getItem(LS),p=$('#p1').value,e=$('#le'),b=$('#go');
if(nw){if(p.length<6)return e.textContent='Use at least 6 characters.';if(p!==$('#p2').value)return e.textContent='Passcodes do not match.'}
b.disabled=true;e.textContent='';
try{if(nw)await create(p);else if(!await unlock(p)){e.textContent='Wrong passcode.';$('#p1').value='';b.disabled=false;return}}catch(x){e.textContent='Something went wrong. Try again.';b.disabled=false;return}
$('#lock').hidden=true;$('#lock').innerHTML='';cur=today();tab='today';render()}
const lockNow=()=>{KEY=null;S=null;$('#m').innerHTML='';showLock()};
function wipe(){if(confirm('This permanently erases all data on this device. Continue?')){localStorage.removeItem(LS);KEY=null;S=null;showLock()}}
async function chPass(){const p=$('#np').value;if(p.length<6)return st('er3','Use at least 6 characters.',1);SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await derive(p,SALT);await seal();$('#np').value='';st('er3','Passcode changed')}
let dp=null;const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),SA=!!navigator.standalone||matchMedia('(display-mode: standalone)').matches;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
const sheet=h=>{const s=$('#sheet');s.innerHTML=`<div class="sh">${h}<button class="btn" onclick="$('#sheet').hidden=true">Done</button></div>`;s.hidden=false};
function inst(){if(SA)return sheet('<h3>Already installed</h3><p>You are using Weight Journal as an app.</p>');
if(dp){dp.prompt();dp=null;return}
sheet(IOS?'<h3>Install on iPhone</h3><ol><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (the square with an arrow pointing up).</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li><li>Open Weight Journal from your home screen <b>before</b> you create your passcode.</li></ol>':'<h3>Install</h3><p>Open your browser menu and choose <b>Install app</b> or <b>Add to Home screen</b>.</p>')}
const vSec=()=>`<div class="card"><div class="k">Security</div><button class="btn ghost" onclick="lockNow()">Lock now</button><div style="height:14px"></div><label>New passcode</label><input id="np" type="password" autocomplete="new-password" placeholder="6+ characters"><button class="btn ghost" onclick="chPass()">Change passcode</button><div id="er3" class="err"></div></div><div class="card"><div class="k">Install</div>${SA?'<p>Installed. You are using the app.</p>':'<button class="btn" onclick="inst()">Install on your phone</button>'}</div>`;
const dn=s=>{const[a,b,c]=s.split('-').map(Number);return Date.UTC(a,b-1,c)/864e5};
const ds=n=>new Date(n*864e5).toISOString().slice(0,10);
const today=()=>{const t=new Date();return ds(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/864e5)};
const wk=n=>n-((n+3)%7);
const L=()=>Object.keys(S.e).filter(d=>d>=S.start).sort().map(d=>({d,n:dn(d),w:S.e[d].w,k:S.e[d].k}));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const wAvg=(l,w0)=>avg(l.filter(r=>r.w>0&&wk(r.n)===w0).map(r=>r.w));
const f=x=>x==null?'–':String(Math.round(x*100)/100);
const kg=x=>x==null?'–':f(x)+' kg';
const sg=x=>{const r=Math.round(x*100)/100;return(r>0?'▲ ':r<0?'▼ ':'')+Math.abs(r)};
const C=(k,v)=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`;
let tab='today',cur=today();
const st=(id,m,bad)=>{const n=$('#'+id);n.textContent=m;n.className='err'+(bad?' bad':'')};
const go=t=>{tab=t;render();$('#m').scrollTop=0};
const shift=n=>{cur=ds(dn(cur)+n);render()};
const setDate=v=>{if(v){cur=v;render()}};
const edit=d=>{cur=d;go('today')};
function prog(l){const ws=l.filter(r=>r.w>0);
if(!(S.goal>0))return'<div class="card k">Set a goal weight in Settings to see your progress.</div>';
if(!ws.length)return'<div class="card k">Log your first weight to start your progress bar.</div>';
const s=ws[0].w,c=ws[ws.length-1].w,p=s===S.goal?1:Math.max(0,Math.min(1,(s-c)/(s-S.goal))),q=Math.round(p*100);
return`<div class="card"><div class="k">Goal ${f(S.goal)} kg</div><div class="bar"><i style="width:${q}%"></i></div><div>${q}% of the way · ${f(Math.abs(c-S.goal))} kg to go</div></div>`}
function vToday(){const l=L(),ws=l.filter(r=>r.w>0),t=today(),e=S.e[cur]||{},te=S.e[t]&&t>=S.start?S.e[t]:{},cw=ws.length?ws[ws.length-1].w:null,w0=wk(dn(t));
return`<h1>${cur===t?'Today':cur}</h1><p class="sub">${ws.length?ws.length+' days logged — consistency is the real win.':'Log your first weight — every journey starts with one entry.'}</p>
<div class="hero"><div class="k">Current weight</div><div class="big">${cw==null?'–':f(cw)}<small>kg</small></div><div class="k" style="margin-top:10px">${ws.length>1?'Since start '+sg(cw-ws[0].w)+' kg':'Add today’s entry below'}</div></div>
<div class="card"><div class="dt"><button onclick="shift(-1)">‹</button><input type="date" value="${cur}" min="${S.start}" onchange="setDate(this.value)"><button onclick="shift(1)">›</button></div>
<div class="in"><div><label>Weight (kg)</label><input id="w" inputmode="decimal" placeholder="82.4" value="${e.w||''}"></div><div><label>Calories (kcal)</label><input id="k" inputmode="numeric" placeholder="1650" value="${e.k||''}"></div></div>
<button class="btn" onclick="saveDay()">Save</button><div id="er" class="err"></div></div>
<div class="grid g3">${C('Week avg, kg',f(wAvg(l,w0)))}${C('Eaten, kcal',te.k||'–')}${C('Left today',te.k?S.target-te.k:'–')}</div>${prog(l)}`}
function saveDay(){const w=$('#w').value.trim().replace(',','.'),k=$('#k').value.trim();
if(cur<S.start)return st('er','Choose a date on or after your start date ('+S.start+').',1);
const wn=w===''?null:Number(w),kn=k===''?null:Number(k);
if(wn!==null&&!(wn>=20&&wn<=400))return st('er','Weight must be between 20 and 400 kg.',1);
if(kn!==null&&!(Number.isInteger(kn)&&kn>=1&&kn<=10000))return st('er','Calories must be a whole number from 1 to 10,000.',1);
const e={};if(wn!==null)e.w=wn;if(kn!==null)e.k=kn;
if(wn===null&&kn===null)delete S.e[cur];else S.e[cur]=e;
save();render();st('er','Saved')}
function chartW(ws){if(!ws.length)return'<p class="k">No weights yet.</p>';
const last=ws[ws.length-1].n,p=ws.filter(r=>r.n>last-182),ys=p.map(r=>r.w),lo=Math.min(...ys)-1,hi=Math.max(...ys)+1,x0=p[0].n,sp=Math.max(1,last-x0),
X=n=>20+(p.length>1?(n-x0)/sp:.5)*300,Y=v=>120-(v-lo)/(hi-lo)*100;
return`<svg viewBox="0 0 340 140"><polyline fill="none" stroke="var(--w)" stroke-width="2" points="${p.map(r=>X(r.n)+','+Y(r.w)).join(' ')}"/>${p.map(r=>`<circle cx="${X(r.n)}" cy="${Y(r.w)}" r="3" fill="var(--w)"/>`).join('')}<g font-size="10" fill="var(--mut)"><text x="20" y="136">${ds(x0)}</text><text x="320" y="136" text-anchor="end">${ds(last)}</text><text x="20" y="12">${f(hi-1)} kg max</text><text x="320" y="12" text-anchor="end">${f(lo+1)} kg min</text></g></svg>`}
function vWeight(){const l=L(),ws=l.filter(r=>r.w>0),w0=wk(dn(today())),s=ws.length?ws[0].w:null,c=ws.length?ws[ws.length-1].w:null,
wks=[...new Set(ws.map(r=>wk(r.n)))].sort((a,b)=>b-a);
return`<h1>Weight</h1><p class="sub">Averages beat single days. Weeks run Monday to Sunday.</p><div class="grid">${C('Starting',kg(s))}${C('Current',kg(c))}${C('Total change',s==null?'–':sg(c-s)+' kg')}${C('This week avg',kg(wAvg(l,w0)))}${C('Last week avg',kg(wAvg(l,w0-7)))}${C('Goal',S.goal>0?f(S.goal)+' kg':'–')}</div>${prog(l)}
<div class="card"><div class="k">Daily weight, last 26 weeks</div>${chartW(ws)}</div>
<div class="card"><table><tr><th>Week starting</th><th>Average</th><th>vs prev week</th></tr>${wks.map(w=>{const a=wAvg(l,w),p=wAvg(l,w-7);return`<tr><td>${ds(w)}</td><td>${f(a)}</td><td>${p==null?'–':sg(a-p)}</td></tr>`}).join('')}</table></div>`}
function vCal(){const l=L().filter(r=>r.k>0),t=today(),te=S.e[t]&&t>=S.start?S.e[t]:{},tn=dn(t),T=S.target,ok=l.filter(r=>r.k<=T).length,bars=[];
for(let i=41;i>=0;i--){const d=ds(tn-i),e=S.e[d];bars.push({i:41-i,k:e&&d>=S.start&&e.k?e.k:0})}
const mx=Math.max(T,...bars.map(b=>b.k))*1.1,y=v=>125-v/mx*110;
return`<h1>Calories</h1><p class="sub">Green is within target, amber is a bit over. One day is just one day.</p><div class="grid">${C('Today',te.k?te.k+' kcal':'–')}${C('Left today',te.k?T-te.k:'–')}${C('Daily target',T+' kcal')}${C('Days logged',l.length)}${C('Within target',ok)}${C('% within',l.length?Math.round(ok/l.length*100)+'%':'–')}</div>
<div class="card"><div class="k">Last 6 weeks vs target</div><svg viewBox="0 0 340 140">${bars.map(b=>b.k?`<rect class="${b.k<=T?'b1':'b2'}" x="${10+b.i*7.7}" width="5.5" y="${y(b.k)}" height="${125-y(b.k)}" rx="1.5"/>`:'').join('')}<line x1="8" x2="332" y1="${y(T)}" y2="${y(T)}" stroke="var(--mut)" stroke-dasharray="4 3"/><text x="332" y="${y(T)-4}" font-size="10" text-anchor="end" fill="var(--mut)">${T}</text></svg></div>
<div class="card"><table><tr><th>Date</th><th>Eaten</th><th>Left / over</th></tr>${[...l].reverse().map(r=>`<tr data-d="${r.d}" onclick="edit('${r.d}')"><td>${r.d}</td><td>${r.k}</td><td class="${r.k<=T?'ok':'over'}">${r.k<=T?(T-r.k)+' left':(r.k-T)+' over'}</td></tr>`).join('')}</table></div>`}
function vSet(){return`<h1>Settings</h1><p class="sub">Entries before the start date are ignored.</p><div class="card"><label>Start date</label><input type="date" id="sd" value="${S.start}"><div style="height:10px"></div><label>Goal weight (kg, optional)</label><input id="gw" inputmode="decimal" value="${S.goal||''}"><div style="height:10px"></div><label>Daily calorie target (kcal)</label><input id="tg" inputmode="numeric" value="${S.target}"><button class="btn" onclick="saveSet()">Save settings</button><div id="er" class="err"></div></div>
<div class="card"><div class="k">Backup</div><textarea id="bk" placeholder="Back up puts a copy here. To restore, paste a backup here and tap Restore."></textarea><button class="btn" onclick="bkp()">Back up</button><button class="btn ghost" onclick="rst()">Restore (replaces current data)</button><div id="er2" class="err"></div></div>${vSec()}`}
function saveSet(){const sd=$('#sd').value,g=$('#gw').value.trim().replace(',','.'),t=$('#tg').value.trim();
if(!sd)return st('er','Choose a start date.',1);
const gn=g===''?null:Number(g),tg=Number(t);
if(gn!==null&&!(gn>=20&&gn<=400))return st('er','Goal must be between 20 and 400 kg.',1);
if(t===''||!(Number.isInteger(tg)&&tg>=500&&tg<=10000))return st('er','Target must be a whole number from 500 to 10,000.',1);
S.start=sd;S.goal=gn;S.target=tg;save();st('er','Saved')}
function bkp(){const j=JSON.stringify(S);$('#bk').value=j;if(window.Android)Android.share(j);else{$('#bk').select();try{document.execCommand('copy')}catch(e){}}st('er2','Backup ready. Keep it somewhere safe.')}
function rst(){try{const o=JSON.parse($('#bk').value),R=/^\d{4}-\d\d-\d\d$/;
if(!o||typeof o.e!=='object'||!R.test(o.start))throw 0;
const e={};for(const d in o.e){const v=o.e[d],x={};if(!R.test(d))throw 0;
if(v.w!=null){if(!(v.w>=20&&v.w<=400))throw 0;x.w=+v.w}
if(v.k!=null){if(!(Number.isInteger(v.k)&&v.k>=1&&v.k<=10000))throw 0;x.k=+v.k}e[d]=x}
S={start:o.start,goal:o.goal>0?+o.goal:null,target:o.target>=500?+o.target:1700,e};save();st('er2','Restored')}catch(x){st('er2','That is not a valid backup.',1)}}
function render(){$('#m').innerHTML={today:vToday,weight:vWeight,cal:vCal,set:vSet}[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
let hid=0;document.addEventListener('visibilitychange',()=>{if(document.hidden){hid=Date.now();return}if(!S)return;if(Date.now()-hid>12e4)return lockNow();cur=today();render()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
showLock();
</script></body></html>
